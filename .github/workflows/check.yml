# プルリクエストのたびに、型・lint・テスト・ページに入れるスクリプトを確かめる（AGENTS.md の「終わる前に通すもの」と同じ）。
# develop に入ったあとは「TestFlight に出す」（testflight.yml）が同じチェックをしてから版を作るので、ここはプルリクエストだけ
name: チェック

on:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci
      - run: npm run check:pages
