# 直しを入れるたびに、型・lint・テスト・ページに入れるスクリプトを確かめる（AGENTS.md の「終わる前に通すもの」と同じ）。
# develop への push と、プルリクエストで動く。ここが通らない直しは、「直しを送る」でも送られない。
name: チェック

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci
      - run: npm run check:pages
