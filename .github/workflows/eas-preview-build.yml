# 登録した iPhone に配る版を、EAS で作る（docs/distribution.md の 2.）。
# GitHub の Actions のページ（スマホの GitHub アプリでもよい）から「Run workflow」で始める。Mac は要らない。
# 新しく登録した iPhone も、自動で入れる（EAS に App Store Connect の API キーを登録してあること）。
# 作るのは develop の中身だけ。チェックが通らなければ作らない（作り直しは iOS で年 15 回まで。無駄にしない）。
name: iPhone に配る版を作る

on:
  workflow_dispatch:

concurrency:
  group: eas-preview-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          # 版は固定する（上げるときは、ここを書き換えて試す）
          eas-version: 27.10.0
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci
      - run: npm run check:pages

      # クラウドでの作業を始めたら、ここは終わる（できあがりは expo.dev のビルドの一覧で見る）
      - run: eas build --platform ios --profile preview --non-interactive --refresh-ad-hoc-provisioning-profile --no-wait
