# 作り直さずに、直しを送る（docs/distribution.md の 3.）。
# GitHub の Actions のページ（スマホの GitHub アプリでもよい）から「Run workflow」で、直した内容を書いて始める。Mac は要らない。
# 送るのは、develop にある今の中身。チェックが通らなければ送らない。
# 「Run workflow」でほかのブランチを選んでも、develop でなければ止まる（作りかけの直しを、配った iPhone に送らないため）。
name: 直しを送る

on:
  workflow_dispatch:
    inputs:
      message:
        description: 直した内容
        required: true
        type: string

concurrency:
  group: eas-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          # 版は固定する（上げるときは、ここを書き換えて試す）
          eas-version: 27.10.0
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci
      - run: npm run check:pages

      - run: eas update --platform ios --channel preview --environment preview --message "$MESSAGE" --non-interactive
        env:
          MESSAGE: ${{ inputs.message }}
